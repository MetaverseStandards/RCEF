name: Check
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install msf-tools at the locked commit
        env:
          MSF_TOOLS_TOKEN: ${{ secrets.MSF_TOOLS_TOKEN }}
        run: |
          # The token stays in git's URL rewrite, so it is never written into the
          # installed package's direct_url.json.
          git config --global url."https://x-access-token:${MSF_TOOLS_TOKEN}@github.com/".insteadOf "https://github.com/"
          commit=$(python -c "import json; print(json.load(open('evidence/tooling.lock.json'))['git_commit'])")
          python -m pip install "git+https://github.com/Kjakubzak/msf-tools@${commit}"
          git config --global --unset-all url."https://x-access-token:${MSF_TOOLS_TOKEN}@github.com/".insteadOf
      - run: python -B check.py
      - run: python -B -m unittest discover -s tests -v
