name: Authoring acceptance
# Shared tools start locally. Configure the pinned dependency before remote execution.
on:
  workflow_dispatch:
    inputs:
      tools_repository:
        description: Shared tools repository (owner/name)
        required: true
        type: string
      tools_ref:
        description: Reviewed immutable shared tools commit SHA
        required: true
        type: string
permissions:
  contents: read
jobs:
  parity:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@v4
        with:
          path: RCEF
      - uses: actions/checkout@v4
        with:
          repository: ${{ inputs.tools_repository }}
          ref: ${{ inputs.tools_ref }}
          path: .ci-tools
          token: ${{ secrets.MSF_TOOLS_TOKEN || github.token }}
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -B check.py --tools-path ../.ci-tools
        working-directory: RCEF
      - run: python -B tests/test_parity.py --tools-path ../.ci-tools
        working-directory: RCEF
