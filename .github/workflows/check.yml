name: Check
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install the locked msf-character-tools release wheel by hash
        run: |
          python - <<'EOF' > "$RUNNER_TEMP/tag.txt"
          import json, platform, sys
          lock = json.load(open('evidence/tooling.lock.json'))
          abi = 'cp311-cp311' if sys.version_info[:2] == (3, 11) else 'cp312-abi3'
          tag = f'{abi}-manylinux_2_28_{platform.machine()}'
          print(tag, lock['package_version'], lock['wheels'][tag]['sha256'])
          EOF
          read -r tag version sha < "$RUNNER_TEMP/tag.txt"
          wheel="msf_character_tools-${version}-${tag}.whl"
          curl -fsSL --retry 3 -o "$RUNNER_TEMP/$wheel" \
            "https://github.com/MetaverseStandards/msf_character_tools/releases/download/v${version}/${wheel}"
          echo "msf-character-tools @ file://${RUNNER_TEMP}/${wheel} --hash=sha256:${sha}" > "$RUNNER_TEMP/msf-character-tools.txt"
          python -m pip install --require-hashes -r "$RUNNER_TEMP/msf-character-tools.txt"
      - run: python -B check.py
      - run: python -B -m unittest discover -s tests -v
