# Original RCEF data. Values computed inside a mapping and never read or written
# by a provider. The first four belong to the direct map arkit_gaze.to_fb2, the
# next four to the out-map rcef_gaze.to_fb2 and the last one to the viseme
# in-map visemes_aggregate.to_rcef. Its units are the source's, probability,
# because a weighted sum cannot change units; its range, 0 to 3, is not a
# probability range.

