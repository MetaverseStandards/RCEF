# Original RCEF data. Values computed inside a mapping and never read or written
# by a provider. The first four belong to the direct map arkit_gaze.to_fb2, the
# next four to the out-map rcef_gaze.to_fb2 and the ninth to the viseme in-map
# visemes_aggregate.to_rcef. Its units are the source's, probability, because a
# weighted sum cannot change units; its range, 0 to 4, is not a probability
# range. The rest belong to the viseme pose bridge
# rcef_viseme_pose.to_rcef_expression; scripts/build_canonical.py writes them and
# the profile.

[[signals]]
id = "rcef.intermediate.arkit_gaze_in_minus_out_L"
label = "RCEF ARKit eyeLookInLeft minus eyeLookOutLeft"
value_type = "scalar"
units = "1"
domain = { "min" = -1.0, "max" = 1.0 }
calibration = "rcef.intermediate.v1:arkit_gaze_in_minus_out_L: ARKit eyeLookInLeft minus eyeLookOutLeft on ARKit's coefficient scale"
disposition = "mapped"
evidence = ["apple_blendshapes", "xr_fb2"]
evidence_status = "proposed"
side = "left"
neutral = 0.0
metadata = { "definition" = "The left eye's ARKit gaze toward the nose minus away from it, from -1 to 1. Computed inside arkit_gaze.to_fb2 and split into the two opposing FB2 directions; no provider reads or writes it.", "reason" = "Intermediate value of a proposed approximate translation." }
