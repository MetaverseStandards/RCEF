:root{color-scheme:light;--paper:#f4f5ef;--card:#fff;--ink:#182b29;--muted:#415b57;--line:#c8d5cc;--green:#17614c;--blue:#155576;--amber:#75500e;--soft:#e8f1e8;--radius:16px}
*{box-sizing:border-box}html{scroll-behavior:smooth;scroll-padding-top:5rem}body{margin:0;background:var(--paper);color:var(--ink);font:16px/1.65 system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}a{color:var(--blue);text-underline-offset:3px;overflow-wrap:anywhere}a:hover{text-decoration-thickness:2px}:focus-visible{outline:3px solid #985500;outline-offset:4px;border-radius:3px}.skip{position:absolute;top:-100px;left:16px;background:white;padding:10px;z-index:10}.skip:focus{top:10px}.wrap{max-width:1180px;margin:auto;padding:0 28px}.masthead{padding:22px 0;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;gap:18px}.wordmark{font-weight:850;letter-spacing:.08em}.edition{font-size:.82rem;color:var(--muted)}header{background:#123f35;color:#f1f7f1;padding-bottom:44px}header .masthead{border-color:#477767}header .edition{color:#c8e1d1}header a{color:#d5f0ef}.eyebrow{text-transform:uppercase;letter-spacing:.14em;font-size:.75rem;font-weight:700;margin:36px 0 12px}h1{font-size:clamp(2.3rem,5.5vw,4.2rem);line-height:1.1;letter-spacing:-.045em;max-width:850px;margin:0 0 22px}header .intro{max-width:790px;font-size:1.1rem;color:#daebe0}header .links{display:flex;gap:24px;flex-wrap:wrap;margin-top:22px}nav{background:#fff;border-bottom:1px solid var(--line);position:sticky;top:0;z-index:3}nav .wrap{display:flex;gap:24px;overflow-x:auto;padding-top:13px;padding-bottom:13px;white-space:nowrap}nav a{font-size:.88rem;font-weight:650;text-decoration:none}main{padding-top:30px;padding-bottom:44px}section{margin-top:52px}h2{font-size:clamp(1.6rem,3vw,2.1rem);line-height:1.25;letter-spacing:-.025em;margin:0 0 16px}h3{font-size:1.15rem;line-height:1.35;margin:28px 0 12px}h4{font-size:1rem;margin:18px 0 8px}p{margin:12px 0}ul,ol{padding-left:24px}li+li{margin-top:8px}.lede{max-width:830px;color:var(--muted)}.stats{display:grid;grid-template-columns:repeat(7,1fr);gap:10px;margin-top:18px}.stat{background:#fff;border:1px solid