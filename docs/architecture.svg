n;gap:5px;font-size:.85rem;font-weight:650}.controls label.grow{flex:1;min-width:180px}select,input[type=search]{font:inherit;line-height:1.4;padding:9px 12px;background:#fff;border:1px solid #82988d;border-radius:7px;min-height:44px;max-width:100%;color:var(--ink)}button{font:inherit;min-height:44px;border:1px solid #17614c;border-radius:7px;padding:8px 16px;background:#17614c;color:white;cursor:pointer}button:hover{background:#104939}fieldset{border:1px solid var(--line);border-radius:10px;padding:16px;margin:16px 0;min-width:0}legend{font-weight:700;padding:0 5px}input[type=range]{width:100%;accent-color:var(--green);min-height:36px}input[type=checkbox]{accent-color:var(--green);width:20px;height:20px;vertical-align:middle;margin-right:8px}.range-row{margin:12px 0}.range-row label{display:flex;justify-content:space-between;gap:12px;font-size:.9rem}.range-row output{font-weight:750;font-variant-numeric:tabular-nums}.range-ends{display:flex;justify-content:space-between;font-size:.75rem;color:var(--muted)}.result{background:#123f35;color:white;padding:18px 22px;border-radius:12px;min-height:105px}.result p{margin:4px 0}.result strong{font-size:1.1rem}.result code{background:none;color:inherit;padding:0}.small{font-size:.84rem;color:var(--muted)}details{border:1px solid var(--line);border-radius:9px;background:#fff;padding:12px 16px;margin:14px 0}summary{cursor:pointer;font-weight:650;min-height:28px}.stage-card{padding:18px 22px;background:#edf4ed;border:1px solid var(--line);border-radius:10px;margin:14px 0}.stage-card h3{margin:0 0 8px}.license{font-size:.8rem;color:var(--muted)}footer{border-top:1px solid var(--line);padding:25px 0;background:white}svg text{font-family:system-ui,-apple-system,sans-serif}.flow-node{fill:#fff;stroke:#819d90;stroke-width:1.5}.flow-msf{fill:#eaf4ed}.flow-runtime{fill:#e9f1f6}.flow-gate{fill:#f7f0df}.arrow{fill:none;stroke:#446e61;stroke-width:2;marker-end:url(#arrowhead)}.divider{height:1px;background:var(--line);margin:28px 0}[hidden]{display:none!important}
@media(max-width:900px){.stats{grid-template-columns:repeat(4,1fr)}.grid{grid-template-columns:1fr}.wrap{padding:0 20px}.panel{padding:20px}nav .wrap{gap:20px;padding-top:12px;padding-bottom:12px}}
@media(max-width:520px){.stats{grid-template-columns:repeat(2,1fr)}.masthead{align-items:start;flex-direction:column;gap:4px}.controls{align-items:stretch;flex-direction:column}.controls label{width:100%}select{width:100%}.panel{padding:16px}.edition{font-size:.75rem}th,td{padding:10px}section{margin-top:38px}}
