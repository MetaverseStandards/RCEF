<rect x="0" y="0" width="1160" height="560" fill="#ffffff"/>

<title id="diagram-title">RCEF data and the msf-character-tools engine: check, compile, evaluate</title><desc id="diagram-desc">check.py first checks the installed msf-character-tools against tooling.lock.json (lock format 2, one entry per wheel tag, a hash for every package file). Then it checks the calibration records against the FREEZES ledger. msf-character-tools discovers and validates the 36 RCEF TOML files and compiles a pack. The pack feeds two paths. The generated pack JSON goes to the RCEF report exporter. The in-memory Pack goes to map compilation and evaluation. The map and evaluate commands build the Pack again from TOML. The calibration tools check provenance before a held-out run and write the results into a record. Reports are not made from runtime frames. Independent review is still necessary.</desc>
