<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1160 560" role="img" aria-labelledby="diagram-title diagram-desc">
<style>
/* Original presentation and diagrams: CC-BY-SA-4.0, RCEF contributors (2026). */
:root{color-scheme:light;--paper:#f4f5ef;--card:#fff;--ink:#182b29;--muted:#415b57;--line:#c8d5cc;--green:#17614c;--blue:#155576;--amber:#75500e;--soft:#e8f1e8;--radius:16px}
*{box-sizing:border-box}html{scroll-behavior:smooth;scroll-padding-top:5rem}body{margin:0;background:var(--paper);color:var(--ink);font:16px/1.65 system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}a{color:var(--blue);text-underline-offset:3px;overflow-wrap:anywhere}a:hover{text-decoration-thickness:2px}:focus-visible{outline:3px solid #985500;outline-offset:4px;border-radius:3px}.skip{position:absolute;top:-100px;left:16px;background:white;padding:10px;z-index:10}.skip:focus{top:10px}.wrap{max-width:1180px;margin:auto;padding:0 28px}.masthead{padding:22px 0;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;gap:18px}.wordmark{font-weight:850;letter-spacing:.08em}.edition{font-size:.82rem;color:var(--muted)}header{background:#123f35;color:#f1f7f1;padding-bottom:44px}header .masthead{border-color:#477767}header .edition{color:#c8e1d1}header a{color:#d5f0ef}.eyebrow{text-transform:uppercase;letter-spacing:.14em;font-size:.75rem;font-weight:700;margin:36px 0 12px}h1{font-size:clamp(2.3rem,5.5vw,4.2rem);line-height:1.1;letter-spacing:-.045em;max-width:850px;margin:0 0 22px}header .intro{max-width:790px;font-size:1.1rem;color:#daebe0}header .links{display:flex;gap:24px;flex-wrap:wrap;margin-top:22px}nav{background:#fff;border-bottom:1px solid var(--line);position:sticky;top:0;z-index:3}nav .wrap{display:flex;gap:24px;overflow-x:auto;padding-top:13px;padding-bottom:13px;white-space:nowrap}nav a{font-size:.88rem;font-weight:650;text-decoration:none}main{padding-top:30px;padding-bottom:44px}section{margin-top:52px}h2{font-size:clamp(1.6rem,3vw,2.1rem);line-height:1.25;letter-spacing:-.025em;margin:0 0 16px}h3{font-size:1.15rem;line-height:1.35;margin:28px 0 12px}h4{font-size:1rem;margin:18px 0 8px}p{margin:12px 0}ul,ol{padding-left:24px}li+li{margin-top:8px}.lede{max-width:830px;color:var(--muted)}.stats{display:grid;grid-template-columns:repeat(7,1fr);gap:10px;margin-top:18px}.stat{background:#fff;border:1px solid var(--line);padding:16px 12px;border-radius:12px}.stat strong{display:block;font-size:1.9rem;line-height:1.2;color:var(--green);font-variant-numeric:tabular-nums}.stat span{font-size:.75rem;display:block;line-height:1.4;margin-top:7px}.note{border-left:4px solid var(--green);padding:12px 18px;background:var(--soft);margin:20px 0;border-radius:0 8px 8px 0}.caveat{background:#f7f0df;border-color:var(--amber)}.panel{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:24px;margin:20px 0}.grid{display:grid;grid-template-columns:1fr 1fr;gap:20px}.grid .panel{margin:0}.source{font-size:.83rem;color:var(--muted);margin-top:18px}.tag{font-size:.73rem;letter-spacing:.06em;font-weight:800;color:var(--green);text-transform:uppercase}.table-scroll,.diagram-scroll{overflow:auto;border:1px solid var(--line);border-radius:12px;background:white}.diagram-scroll{padding:16px}.diagram-scroll svg{display:block;width:100%;min-width:850px;height:auto}table{width:100%;border-collapse:collapse;font-size:.87rem;line-height:1.5;background:#fff}caption{text-align:left;font-weight:700;padding:14px 16px}th,td{text-align:left;vertical-align:top;padding:12px 14px;border-bottom:1px solid #dbe4df}thead th{background:#eaf1eb;font-size:.8rem}tbody tr:last-child>*{border-bottom:0}tbody th{font-weight:600}td small{display:block;font: .73rem/1.5 ui-monospace,SFMono-Regular,Consolas,monospace;color:var(--muted);margin-top:5px}.num{text-align:right;font-variant-numeric:tabular-nums}code{font: .88em/1.6 ui-monospace,SFMono-Regular,Consolas,monospace;overflow-wrap:anywhere}p code,li code,td code{background:#eaf0ea;padding:1px 4px;border-radius:4px}pre{white-space:pre-wrap;overflow-wrap:anywhere;padding:18px;border-radius:10px;border:1px solid var(--line);background:#f0f4ef;font:.8rem/1.6 ui-monospace,SFMono-Regular,Consolas,monospace;margin:16px 0}.controls{display:flex;align-items:end;gap:16px;flex-wrap:wrap;margin:16px 0}.controls label{display:flex;flex-direction:column;gap:5px;font-size:.85rem;font-weight:650}.controls label.grow{flex:1;min-width:180px}select,input[type=search]{font:inherit;line-height:1.4;padding:9px 12px;background:#fff;border:1px solid #82988d;border-radius:7px;min-height:44px;max-width:100%;color:var(--ink)}button{font:inherit;min-height:44px;border:1px solid #17614c;border-radius:7px;padding:8px 16px;background:#17614c;color:white;cursor:pointer}button:hover{background:#104939}fieldset{border:1px solid var(--line);border-radius:10px;padding:16px;margin:16px 0;min-width:0}legend{font-weight:700;padding:0 5px}input[type=range]{width:100%;accent-color:var(--green);min-height:36px}input[type=checkbox]{accent-color:var(--green);width:20px;height:20px;vertical-align:middle;margin-right:8px}.range-row{margin:12px 0}.range-row label{display:flex;justify-content:space-between;gap:12px;font-size:.9rem}.range-row output{font-weight:750;font-variant-numeric:tabular-nums}.range-ends{display:flex;justify-content:space-between;font-size:.75rem;color:var(--muted)}.result{background:#123f35;color:white;padding:18px 22px;border-radius:12px;min-height:105px}.result p{margin:4px 0}.result strong{font-size:1.1rem}.result code{background:none;color:inherit;padding:0}.small{font-size:.84rem;color:var(--muted)}details{border:1px solid var(--line);border-radius:9px;background:#fff;padding:12px 16px;margin:14px 0}summary{cursor:pointer;font-weight:650;min-height:28px}.stage-card{padding:18px 22px;background:#edf4ed;border:1px solid var(--line);border-radius:10px;margin:14px 0}.stage-card h3{margin:0 0 8px}.license{font-size:.8rem;color:var(--muted)}footer{border-top:1px solid var(--line);padding:25px 0;background:white}svg text{font-family:system-ui,-apple-system,sans-serif}.flow-node{fill:#fff;stroke:#819d90;stroke-width:1.5}.flow-msf{fill:#eaf4ed}.flow-runtime{fill:#e9f1f6}.flow-gate{fill:#f7f0df}.arrow{fill:none;stroke:#446e61;stroke-width:2;marker-end:url(#arrowhead)}.divider{height:1px;background:var(--line);margin:28px 0}[hidden]{display:none!important}
@media(max-width:900px){.stats{grid-template-columns:repeat(4,1fr)}.grid{grid-template-columns:1fr}.wrap{padding:0 20px}.panel{padding:20px}nav .wrap{gap:20px;padding-top:12px;padding-bottom:12px}}
@media(max-width:520px){.stats{grid-template-columns:repeat(2,1fr)}.masthead{align-items:start;flex-direction:column;gap:4px}.controls{align-items:stretch;flex-direction:column}.controls label{width:100%}select{width:100%}.panel{padding:16px}.edition{font-size:.75rem}th,td{padding:10px}section{margin-top:38px}}
@media(prefers-reduced-motion:reduce){html{scroll-behavior:auto}}
@media print{body{font-size:10pt;background:white;color:#111}header{background:white;color:#111;padding-bottom:18px}header .intro,header .edition,header a{color:#222}h1{font-size:28pt}h2{font-size:18pt}h3{font-size:13pt}.wrap{max-width:none;padding:0}nav,.skip,.controls,.interactive-inputs,.no-print{display:none!important}main{padding-top:0}section{margin-top:22px}.stats{grid-template-columns:repeat(7,1fr);gap:5px}.stat{padding:8px}.stat strong{font-size:18pt;color:#111}.stat span{font-size:8pt}.panel{padding:12px;border-radius:0;break-inside:avoid}.table-scroll,.diagram-scroll{overflow:visible;border:0}.diagram-scroll{padding:0}.diagram-scroll svg{min-width:0;width:100%}table{font-size:8pt}th,td{padding:6px}thead{display:table-header-group}tr{break-inside:avoid}pre{font-size:8pt;break-inside:avoid}.stage-card[hidden],details[hidden]{display:block!important}.stage-card{padding:10px;background:white;break-inside:avoid}.file-row-print[hidden]{display:table-row!important}.grid{display:block}.grid .panel{margin:12px 0}.result{background:white;color:#111;border:1px solid #888}.note{background:white;border-color:#555}a{color:#111}details{break-inside:avoid}details> :not(summary){display:block!important}footer{padding:12px 0}.tag{color:#333}.lede,.source,.small{color:#333}html{scroll-padding-top:0}}
</style>
<rect x="0" y="0" width="1160" height="560" fill="#ffffff"/>

<title id="diagram-title">RCEF authoring and MSF execution pipeline</title><desc id="diagram-desc">27 RCEF TOML files are discovered and strictly validated by MSF, then compiled to a deterministic pack. The in-memory Pack feeds mapping compilation; its serialized generated JSON separately feeds report export. The map/evaluate CLI rebuilds the Pack from TOML. Runtime and presentation results require independent acceptance. Reports are not generated from runtime frames.</desc>
<defs><marker id="arrowhead" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#446e61"/></marker></defs>
<path class="arrow" d="M340 94 H395" style="marker-end:none"/><path class="arrow" d="M720 94 H775" style="marker-end:none"/><path class="arrow" d="M1100 94 H1135 V178 H180 V228" style="marker-end:none"/>
<path class="arrow" d="M940 148 V204 H560 V228" style="marker-end:none"/><path class="arrow" d="M180 324 V367 H940 V324" style="marker-end:none"/><path class="arrow" d="M560 324 V386 H380 V446" style="marker-end:none"/><path class="arrow" d="M940 324 V493 H765" style="marker-end:none"/>
<rect class="flow-node" x="20" y="42" width="320" height="105" rx="12"/><text x="40" y="68" font-size="12" fill="#17614c" font-weight="750">1 · RCEF DATA / MSF DISCOVERY</text><text x="40" y="96" font-size="20" fill="#182b29" font-weight="750">Authoritative TOML</text><text x="40" y="123" font-size="14" fill="#415b57">27 files · sorted fragment discovery</text>
<rect class="flow-node flow-msf" x="400" y="42" width="320" height="105" rx="12"/><text x="420" y="68" font-size="12" fill="#17614c" font-weight="750">2 · MSF TOOLS</text><text x="420" y="96" font-size="20" fill="#182b29" font-weight="750">Parse &amp; validate</text><text x="420" y="123" font-size="14" fill="#415b57">UTF-8 · schema · numbers · references</text>
<rect class="flow-node flow-msf" x="780" y="42" width="320" height="105" rx="12"/><text x="800" y="68" font-size="12" fill="#17614c" font-weight="750">3 · MSF TOOLS</text><text x="800" y="96" font-size="20" fill="#182b29" font-weight="750">Compile Pack</text><text x="800" y="123" font-size="14" fill="#415b57">Immutable document · canonical hash</text>
<rect class="flow-node" x="20" y="230" width="320" height="94" rx="12"/><text x="40" y="255" font-size="12" fill="#17614c" font-weight="750">4 · GENERATED ARTIFACTS</text><text x="40" y="281" font-size="20" fill="#182b29" font-weight="750">Pack JSON + inventory matrix</text><text x="40" y="306" font-size="14" fill="#415b57">Coverage JSON · exact byte checksums</text>
<rect class="flow-node flow-runtime" x="400" y="230" width="320" height="94" rx="12"/><text x="420" y="255" font-size="12" fill="#155576" font-weight="750">5 · MSF MAPPING RUNTIME</text><text x="420" y="281" font-size="20" fill="#182b29" font-weight="750">Compile rule graph → evaluate</text><text x="420" y="306" font-size="14" fill="#415b57">Explicit endpoints · values + validity</text>
<rect class="flow-node" x="780" y="230" width="320" height="94" rx="12"/><text x="800" y="255" font-size="12" fill="#17614c" font-weight="750">6 · RCEF PRESENTATION</text><text x="800" y="281" font-size="20" fill="#182b29" font-weight="750">Export readable reports</text><text x="800" y="306" font-size="14" fill="#415b57">Inventory · mappings · correspondence</text>
<rect x="712" y="190" width="160" height="28" rx="6" fill="#f4f5ef"/><text x="727" y="209" font-size="13" fill="#415b57">in-memory Pack</text>
<rect x="668" y="352" width="172" height="28" rx="6" fill="#f4f5ef"/><text x="683" y="371" font-size="13" fill="#415b57">pack metadata directly</text><text x="405" y="406" font-size="13" fill="#155576">Typed profiles or explicit glTF/GLB sidecars</text><text x="405" y="426" font-size="13" fill="#155576">Finite scalar samples · seconds · boolean validity</text>
<rect class="flow-node flow-gate" x="360" y="448" width="400" height="92" rx="12"/><text x="380" y="474" font-size="12" fill="#75500e" font-weight="750">7 · INDEPENDENT CONSUMER REVIEW</text><text x="380" y="500" font-size="20" fill="#182b29" font-weight="750">Drift check + acceptance + domain gates</text><text x="380" y="525" font-size="14" fill="#415b57">Qualification scope and remaining unknowns stay explicit</text>

