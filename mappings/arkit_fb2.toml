# SPDX-License-Identifier: CC-BY-SA-4.0
# Original RCEF data; attributed source identifiers are factual inventories.
# Proposed ARKit -> FB2 translations: the FB2 -> ARKit routes read back. A
# coefficient FB2 splits into parts is copied to each part, so FB2 -> ARKit gives
# it back exactly. Gaze is a separate mapping, as in the forward direction.

[[mappings]]
id = "arkit.to_fb2"

[[mappings.rules]]
id = "arkit_fb2.BROW_LOWERER_L"
inputs = ["arkit.coefficient.browDownLeft"]
outputs = ["openxr.fb2.XR_FACE_EXPRESSION2_BROW_LOWERER_L_FB"]
operator = { "id" = "affine", "scale" = 1.0, "offset" = 0.0 }
disposition = "mapped"
mapping_quality = "approximate"
evidence_status = "proposed"
assumptions = [
  "ARKit browDownLeft corresponds to FB2 BROW_LOWERER_L; this is the FB2 -> ARKit rule read back.",
  "ARKit neutral (0) and maximum (1) are taken to equal FB2 weight 0 (not active) and 1 (fully active), linear in between; neither provider publishes its gain curve or full-activation pose.",
  "Both providers name sides from the subject's own face (ARKit coefficients are face-relative; FB2 describes 'the left eye').",
]
evidence = ["xr_fb2", "apple_blendshapes", "godot_vendors_fb2", "godot_face_modifier", "vrcft_docs_arkit", "vrcft_docs_movement", "ict_facekit"]
loss_annotations = [
  { "category" = "signal", "effect" = "approximated", "reason" = "provider gain and full-activation pose are not published; 0 and 1 endpoints assumed equal", "refs" = ["arkit.coefficient.browDownLeft", "openxr.fb2.XR_FACE_EXPRESSION2_BROW_LOWERER_L_FB"], "units" = "1" },
]

