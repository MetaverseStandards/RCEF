# SPDX-License-Identifier: CC-BY-SA-4.0
# Original RCEF data; attributed source identifiers are factual inventories.
# Proposed ARKit -> Unified Expressions (VRCFaceTracking avatar base shapes). Where
# Unified Expressions makes an ARKit coefficient from several base shapes, the
# ARKit value is copied to each part; VRCFaceTracking's own composite (a mean, or
# the published 0.75/0.25 and 0.8/0.2 splits) then gives it back exactly.

[[mappings]]
id = "arkit.to_vrcft_artist"

[[mappings.rules]]
id = "arkit_vrcft_artist.BrowLowererLeft"
inputs = ["arkit.coefficient.browDownLeft"]
outputs = ["vrcft.artist.base.BrowLowererLeft"]
operator = { "id" = "affine", "scale" = 1.0, "offset" = 0.0 }
disposition = "mapped"
mapping_quality = "approximate"
evidence_status = "proposed"
assumptions = [
  "ARKit browDownLeft is a blended Unified Expressions shape; BrowLowererLeft is set to the ARKit value, as is BrowPinchLeft. VRCFaceTracking defines the blended shape as 0.75 x BrowLowererLeft + 0.25 x BrowPinchLeft; the weights sum to 1, so copying the ARKit value into both parts gives it back.",
  "ARKit neutral (0) and maximum (1) are taken to equal the Unified Expressions shape at rest (0) and fully applied (1), linear in between; neither publishes its gain curve or full-activation pose.",
  "Both name sides from the subject's own face (ARKit coefficients are face-relative; Unified Expressions shapes name the avatar's own side).",
]
evidence = ["apple_blendshapes", "vrcft_artist", "godot_face_modifier", "vrcft_docs_arkit", "vrcft_simple_expressions"]
loss_annotations = [
  { "category" = "signal", "effect" = "approximated", "reason" = "Unified Expressions splits this shape into parts whose ratio cannot be recovered from ARKit; the parts are set equal", "refs" = ["arkit.coefficient.browDownLeft", "vrcft.artist.base.BrowLowererLeft"], "units" = "1" },
  { "category" = "signal", "effect" = "approximated", "reason" = "provider gain and full-activation pose are not published; 0 and 1 endpoints assumed equal", "refs" = ["arkit.coefficient.browDownLeft", "vrcft.artist.base.BrowLowererLeft"], "units" = "1" },
]

