# Original RCEF data; attributed source identifiers are factual inventories.
# Written by scripts/build_canonical.py from docs/canonical-set.md,
# docs/canonical-set-audit.md, tests/fixtures/ipa_chart_symbols.json and today's
# direct maps (tests/fixtures/baseline-dea1713.pack.json). Edit those, then run
# the script.
# The maps between the canonical sets and ARKit: one map per canonical group and
# direction. In-maps are <set>_<group>.to_rcef; out-maps are rcef_<group>.to_<set>.

[[mappings]]
id = "arkit_face.to_rcef"

[[mappings.rules]]
id = "arkit_rcef.brow_inner_raise_left"
inputs = ["arkit.coefficient.browInnerUp"]
outputs = ["rcef.canonical_expression.brow_inner_raise_left"]
operator = { "id" = "affine", "scale" = 1.0, "offset" = 0.0 }
disposition = "mapped"
mapping_quality = "approximate"
evidence_status = "proposed"
assumptions = [
  "correspondence: ARKit browInnerUp is one value for canonical brow_inner_raise_left and brow_inner_raise_right; this mapping writes brow_inner_raise_left.",
  "endpoints: ARKit's 0 and 1 for this shape are assumed to be canonical 0 and 1, and values between are assumed to correspond as the operator passes them; no evidence supports this, and no response curve is measured; the one ARKit value is copied into each part.",
  "transfer.provider: correspondence evidence is FB2↔ARKit (vrcft_code_parameters, vrcft_docs_movement, vrcft_docs_arkit); it carries over because canonical brow_inner_raise_left is defined to match FB2 INNER_BROW_RAISER_L.",
  "transfer.provider: correspondence evidence is Unified Expressions↔ARKit (godot_face_modifier, vrcft_docs_arkit, vrcft_code_parameters); it carries over because canonical brow_inner_raise_left is defined to match Unified Expressions BrowInnerUpLeft.",
  "transfer.facs_crosswalk: ict_facekit relates FACS code 1 to ARKit browInnerUp; it carries over because canonical brow_inner_raise_left has facs_au 1.",
]
evidence = ["apple_blendshapes", "vrcft_code_parameters", "vrcft_docs_movement", "vrcft_docs_arkit", "ict_facekit", "godot_face_modifier", "rcef_canonical_v1"]
loss_annotations = [
  { "category" = "signal", "effect" = "approximated", "reason" = "asymmetry unknown: symmetry is invented", "refs" = ["arkit.coefficient.browInnerUp", "rcef.canonical_expression.brow_inner_raise_left"], "units" = "1" },
  { "category" = "signal", "effect" = "approximated", "reason" = "ARKit gain and full-activation pose not published", "refs" = ["arkit.coefficient.browInnerUp", "rcef.canonical_expression.brow_inner_raise_left"], "units" = "1" },
]

