# SPDX-License-Identifier: CC-BY-SA-4.0
# Original RCEF data; FACS code numbers and names are facts from a public list
# (record facs_wikipedia). This is not FACS coding, and the values are not FACS
# scores. Written by scripts/build_canonical.py from docs/canonical-set.md,
# docs/canonical-set-audit.md, examples/data/facs_codes.json and
# tests/fixtures/rocketbox_au_names.json. Edit those, then run the script.
# The maps between the canonical expression set and FACS codes (facs.code): one map
# per direction, facs.to_rcef_expression and rcef_expression.to_facs. Their rules are in
# canonical group order; docs/map-sets/ has a page per map that lists them by group.

[[mappings]]
id = "facs.to_rcef_expression"

[[mappings.rules]]
id = "facs_rcef.brow_inner_raise_left"
inputs = ["facs.code.au01_left"]
outputs = ["rcef.canonical_expression.brow_inner_raise_left"]
operator = { "id" = "affine", "scale" = 1.0, "offset" = 0.0 }
disposition = "mapped"
mapping_quality = "approximate"
evidence_status = "proposed"
assumptions = [
  "correspondence: FACS L1 corresponds to canonical brow_inner_raise_left.",
  "endpoints: FACS intensity E, the maximum for the person, is assumed to be canonical 1, and 'absent' (a scored frame does not list the code) is assumed to be canonical 0; FACS defines only the ordered letters A-E, so values between are RCEF's encoding (docs/facs-intensity.md) and correspond as the operator passes them; no evidence supports this, and no response curve is measured; the value is carried over unchanged.",
]
evidence = ["facs_wikipedia", "rcef_canonical_v1"]
loss_annotations = [
  { "category" = "signal", "effect" = "approximated", "reason" = "facs_ordinal_intensity: FACS intensity is ordinal (letters A-E, E the person's maximum); the numeric value is an RCEF encoding; equal steps are not claimed; no gain is measured", "refs" = ["facs.code.au01_left", "rcef.canonical_expression.brow_inner_raise_left"], "units" = "1" },
  { "category" = "signal", "effect" = "approximated", "reason" = "facs_side_frame_unresolved: FACS names L and R without saying whose side; RCEF reads them as the subject's own", "refs" = ["facs.code.au01_left", "rcef.canonical_expression.brow_inner_raise_left"], "units" = "1" },
]

