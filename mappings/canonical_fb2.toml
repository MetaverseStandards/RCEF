# The maps between the canonical sets and FB2: one map per canonical group and
# direction. In-maps are <set>_<group>.to_rcef; out-maps are rcef_<group>.to_<set>.

[[mappings]]
id = "fb2_face.to_rcef"

[[mappings.rules]]
id = "fb2_rcef.brow_inner_raise_left"
inputs = ["openxr.fb2.XR_FACE_EXPRESSION2_INNER_BROW_RAISER_L_FB"]
outputs = ["rcef.canonical_expression.brow_inner_raise_left"]
operator = { "id" = "affine", "scale" = 1.0, "offset" = 0.0 }
disposition = "mapped"
mapping_quality = "approximate"
evidence_status = "proposed"
assumptions = [
  "correspondence: FB2 INNER_BROW_RAISER_L corresponds to canonical brow_inner_raise_left.",
  "endpoints: FB2's 0 and 1 for this shape are assumed to be canonical 0 and 1, and values between are assumed to correspond as the operator passes them; no evidence supports this, and no response curve is measured; the value is carried over unchanged.",
  "transfer.provider: correspondence evidence is ARKit↔FB2 (vrcft_code_parameters, vrcft_docs_movement, vrcft_docs_arkit); it carries over because canonical brow_inner_raise_left is defined to match ARKit browInnerUp.",
]
evidence = ["xr_fb2", "vrcft_code_parameters", "vrcft_docs_movement", "vrcft_docs_arkit", "rcef_canonical_v1"]
loss_annotations = [
  { "category" = "signal", "effect" = "approximated", "reason" = "FB2 gain and full-activation pose not published", "refs" = ["openxr.fb2.XR_FACE_EXPRESSION2_INNER_BROW_RAISER_L_FB", "rcef.canonical_expression.brow_inner_raise_left"], "units" = "1" },
]

