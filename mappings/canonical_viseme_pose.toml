disposition = "mapped"
mapping_quality = "approximate"
evidence_status = "proposed"
assumptions = [
  "pose: canonical brow_inner_raise_left is the sum of each class weight times the frozen pose of the class in brow_inner_raise_left (calibration record viseme-poses.rocketbox-multi), clamped at 1.",
  "classes: the bridge reads the 9 classes whose held-out cells pass (vowel_open, vowel_close_spread, vowel_mid_rounded, dental, postalveolar, coronal_stop, dorsal, rhotic and sil); vowel_mid_spread, vowel_close_rounded, bilabial, labiodental, alveolar_sibilant and coronal_nasal_lateral failed and are not read, so weight on them moves no expression signal.",
  "example_rigs: the poses are fitted to the sculpted viseme shapes of 10 Rocketbox rigs, measured in their own ARKit units by one bounded fit for all of them; on each of 4 other Rocketbox rigs, which the fit did not use, each pose read here reproduces its class's own shape to within half of its motion; all 14 rigs come from one library, and rigs from other libraries render the same ARKit weights differently (calibration record rig-gains.ict-rocketbox-female).",
  "coarticulation: not modelled; each class is one static pose, and the poses of a blend of classes add up; RCEF has no operator over time.",
  "teeth_tongue: teeth and tongue are not represented; the bridge writes no tongue_out, blink, gaze, jaw_sideways or mouth_shift value.",
  "calibration_status: the record is calibrated_software, a fit to the geometry of example rigs, not a measurement of any tracker; pack schema 1.0 has no such evidence status, so the mapping is proposed.",
]
