# SPDX-License-Identifier: CC-BY-SA-4.0
# Original RCEF data. Written by scripts/build_canonical.py from the frozen poses and held-out
# cells of calibration/viseme-poses.rocketbox-features.cal. Edit the script, not this file.
# The viseme pose bridge, from calibration/viseme-poses.rocketbox-features.cal: each canonical expression
# signal is the clamped sum of class weight times frozen pose, over the canonical viseme
# classes whose held-out cells pass. See docs/canonical-set.md.

[[mappings]]
id = "rcef_viseme_pose.to_rcef_expression"

[[mappings.rules]]
id = "rcef_viseme_pose.vowel_open"
inputs = ["rcef.canonical_viseme.vowel_open"]
outputs = ["rcef.intermediate.viseme_pose_vowel_open"]
operator = { "id" = "affine", "scale" = 1.0, "offset" = 0.0 }
disposition = "mapped"
mapping_quality = "approximate"
evidence_status = "proposed"
assumptions = [
  "correspondence: canonical vowel_open at weight 1 reaches its pose, the face of the META AA viseme shapes of 18 Rocketbox rigs measured in their ARKit shapes (calibration record viseme-poses.rocketbox-features).",
  "units: the class probability (0 to 1) is read as the activation of the class's pose (0 to 1); the unit changes from probability to 1.",
]
evidence = ["xr_visemes", "apple_blendshapes", "ipa_chart_doulos_2020", "rcef_canonical_v1"]
loss_annotations = [
  { "category" = "signal", "effect" = "approximated", "reason" = "viseme_pose_example_rigs: poses of example Rocketbox rigs in their own ARKit units; the geometry of a rig from another library differs", "refs" = ["rcef.canonical_viseme.vowel_open", "rcef.intermediate.viseme_pose_vowel_open"], "units" = "1" },
  { "category" = "signal", "effect" = "approximated", "reason" = "viseme_pose_residual: part of each viseme's own motion is not reproduced (on the held-out rigs 0.24 to 0.38 of it, for the classes read by their shape that move the face)", "refs" = ["rcef.canonical_viseme.vowel_open", "rcef.intermediate.viseme_pose_vowel_open"], "units" = "1" },
  { "category" = "signal", "effect" = "approximated", "reason" = "viseme_pose_perceptual_gate: vowel_mid_spread, vowel_close_rounded, bilabial and alveolar_sibilant are read because their visible mouth features pass, though their whole-face shape error is more than half of the motion", "refs" = ["rcef.canonical_viseme.vowel_open", "rcef.intermediate.viseme_pose_vowel_open"], "units" = "1" },
  { "category" = "signal", "effect" = "approximated", "reason" = "viseme_pose_classes_not_read: labiodental, postalveolar, coronal_nasal_lateral and rhotic failed both held-out gates and are not read", "refs" = ["rcef.canonical_viseme.vowel_open", "rcef.intermediate.viseme_pose_vowel_open"], "units" = "1" },
]

