# Original RCEF data; attributed source identifiers are factual inventories.
# Written by scripts/build_canonical.py from docs/canonical-set.md,
# docs/canonical-set-audit.md, tests/fixtures/ipa_chart_symbols.json and today's
# direct maps (tests/fixtures/baseline-dea1713.pack.json). Edit those, then run
# the script.
# The maps between the canonical sets and META visemes: one map per canonical group and
# direction. In-maps are <set>_<group>.to_rcef; out-maps are rcef_<group>.to_<set>.

[[mappings]]
id = "visemes_vowel.to_rcef"

[[mappings.rules]]
id = "visemes_rcef.vowel_open"
inputs = ["openxr.visemes.XR_FACE_TRACKING_VISEME_AA_META"]
outputs = ["rcef.canonical_viseme.vowel_open"]
operator = { "id" = "affine", "scale" = 1.0, "offset" = 0.0 }
disposition = "mapped"
mapping_quality = "approximate"
evidence_status = "proposed"
assumptions = [
  "correspondence: META viseme AA (META \"A:\" as in car) corresponds to canonical vowel_open; RCEF reads META's example sounds as members of this IPA shape class.",
  "endpoints: META's 0 and 1 for this shape are assumed to be canonical 0 and 1, and values between are assumed to correspond as the operator passes them; no evidence supports this, and no response curve is measured; the value is carried over unchanged.",
]
evidence = ["xr_visemes", "xr_registry", "ipa_chart_doulos_2020", "rcef_canonical_v1"]
loss_annotations = [
  { "category" = "signal", "effect" = "approximated", "reason" = "META gain and full-activation pose not published", "refs" = ["openxr.visemes.XR_FACE_TRACKING_VISEME_AA_META", "rcef.canonical_viseme.vowel_open"], "units" = "1" },
  { "category" = "signal", "effect" = "approximated", "reason" = "meta_viseme_class_scope: META lists English example phonemes; how META classifies other IPA sounds is not stated; RCEF assigns them by shape", "refs" = ["openxr.visemes.XR_FACE_TRACKING_VISEME_AA_META", "rcef.canonical_viseme.vowel_open"], "units" = "1" },
]

