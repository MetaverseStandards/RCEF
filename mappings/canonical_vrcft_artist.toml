# The maps between the canonical expression set and Unified Expressions: one map per canonical group and
# direction. In-maps are <set>_<group>.to_rcef; out-maps are rcef_<group>.to_<set>.

[[mappings]]
id = "rcef_face.to_vrcft_artist"

[[mappings.rules]]
id = "rcef_vrcft_artist.BrowLowererLeft"
inputs = ["rcef.canonical_expression.brow_lower_left"]
outputs = ["vrcft.artist.base.BrowLowererLeft"]
operator = { "id" = "affine", "scale" = 1.0, "offset" = 0.0 }
disposition = "mapped"
mapping_quality = "approximate"
evidence_status = "proposed"
assumptions = [
  "correspondence: Unified Expressions BrowLowererLeft and BrowPinchLeft together correspond to canonical brow_lower_left; this mapping writes BrowLowererLeft.",
  "endpoints: Unified Expressions' 0 and 1 for this shape are assumed to be canonical 0 and 1, and values between are assumed to correspond as the operator passes them; no evidence supports this, and no response curve is measured; the one canonical value is copied into each Unified Expressions part; the endpoints are assumed equal although the defined actions differ or are unresolved; see loss vrcft_ue_set_equal.",
  "transfer.withdrawn: correspondence evidence is ARKit↔Unified Expressions (godot_face_modifier, vrcft_docs_arkit, vrcft_simple_expressions); it does not carry over for the defined action, because the audit finds that ARKit browDownLeft differs from canonical brow_lower_left; and that Unified Expressions BrowLowererLeft and BrowPinchLeft differ from canonical brow_lower_left; see losses arkit_browdown_outer and vrcft_ue_set_equal.",
  "fan_out.vrcft_ue: canonical brow_lower_left is one whole action, which Unified Expressions splits into parts; BrowLowererLeft is set to the canonical value, as is BrowPinchLeft. VRCFaceTracking defines the blended shape as 0.75 x BrowLowererLeft + 0.25 x BrowPinchLeft; the weights sum to 1, so copying the canonical value into both parts gives it back.",
]
evidence = ["vrcft_artist", "vrcft_docs_shapes", "godot_face_modifier", "vrcft_docs_arkit", "vrcft_simple_expressions", "rcef_canonical_v1"]
loss_annotations = [
  { "category" = "signal", "effect" = "approximated", "reason" = "Unified Expressions gain and full-activation pose not published", "refs" = ["rcef.canonical_expression.brow_lower_left", "vrcft.artist.base.BrowLowererLeft"], "units" = "1" },
  { "category" = "signal", "effect" = "approximated", "reason" = "vrcft_ue_set_equal: Unified Expressions splits this shape into parts whose ratio the canonical set does not record; the parts are set equal", "refs" = ["rcef.canonical_expression.brow_lower_left", "vrcft.artist.base.BrowLowererLeft"], "units" = "1" },
]

