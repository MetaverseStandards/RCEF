# SPDX-License-Identifier: CC-BY-SA-4.0
# Original RCEF data; attributed source identifiers are factual inventories.
# Written by scripts/build_canonical.py from docs/canonical-set.md,
# docs/canonical-set-audit.md, tests/fixtures/ipa_chart_symbols.json and the
# retired A1 direct maps (tests/fixtures/baseline-dea1713.pack.json). Edit
# those, then run the script.
# The maps between the canonical sets and VRCFaceTracking eye: one map per set pair and direction,
# <set>.to_rcef_expression or .to_rcef_viseme in, and rcef_expression.to_<set> or
# rcef_viseme.to_<set> out. Their rules are in canonical group order;
# docs/map-sets/ has a page per map that lists them by group.

[[mappings]]
id = "vrcft_eye.to_rcef_expression"

[[mappings.rules]]
id = "vrcft_eye_rcef.eye_close_left"
inputs = ["vrcft.eye.Left.Openness"]
outputs = ["rcef.canonical_expression.eye_close_left"]
operator = { "id" = "affine", "scale" = -1.0, "offset" = 1.0 }
disposition = "mapped"
mapping_quality = "approximate"
evidence_status = "proposed"
assumptions = [
  "correspondence: VRCFaceTracking eye Left.Openness corresponds to canonical eye_close_left.",
  "endpoints: VRCFaceTracking eye's Openness 1 and 0 are assumed to be canonical eye_close 0 and 1, and values between are assumed to correspond as the operator passes them; no evidence supports this, and no response curve is measured; eye_close is 1 − Openness; the endpoints are assumed equal although the defined actions differ or are unresolved; see loss vrcft_eye_openness_neutral_unresolved.",
  "vrcft_eye.openness: eye_close is 1 − Openness. Openness 1 is taken as eye_close 0 (relaxed open lids); VRCFaceTracking does not state that 1 is neutral; Openness outside [0,1] gives an output outside [0,1] and is refused.",
]
evidence = ["vrcft_data", "rcef_canonical_v1"]
loss_annotations = [
  { "category" = "signal", "effect" = "approximated", "reason" = "VRCFaceTracking eye gain and full-activation pose not published", "refs" = ["vrcft.eye.Left.Openness", "rcef.canonical_expression.eye_close_left"], "units" = "1" },
  { "category" = "signal", "effect" = "approximated", "reason" = "vrcft_eye_openness_neutral_unresolved: eye_close is 1 − Openness. Openness 1 is taken as eye_close 0 (relaxed open lids); VRCFaceTracking does not state that 1 is neutral; Openness outside [0,1] gives an output outside [0,1] and is refused", "refs" = ["vrcft.eye.Left.Openness", "rcef.canonical_expression.eye_close_left"], "units" = "1" },
]

