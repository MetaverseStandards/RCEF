]

[[mappings.rules]]
id = "fb2_arkit.browInnerUp"
inputs = ["openxr.fb2.XR_FACE_EXPRESSION2_INNER_BROW_RAISER_L_FB", "openxr.fb2.XR_FACE_EXPRESSION2_INNER_BROW_RAISER_R_FB"]
outputs = ["arkit.coefficient.browInnerUp"]
operator = { "id" = "weighted_sum", "weights" = [0.5, 0.5] }
disposition = "mapped"
mapping_quality = "approximate"
evidence_status = "proposed"
coupling = "bilateral_shared"
assumptions = [
  "ARKit browInnerUp is one coefficient for both sides; it is the mean of FB2 INNER_BROW_RAISER_L and INNER_BROW_RAISER_R, as VRCFaceTracking computes BrowInnerUp; Godot has no combined inner-brow shape.",
  "FB2 weight 0 (not active) and 1 (fully active) are taken to equal ARKit neutral (0) and maximum (1), linear in between; neither provider publishes its gain curve or full-activation pose.",
  "Both providers name sides from the subject's own face (FB2 describes 'the left eye'; ARKit coefficients are face-relative).",
]
evidence = ["xr_fb2", "apple_blendshapes", "vrcft_code_parameters", "vrcft_docs_movement", "vrcft_docs_arkit", "ict_facekit"]
loss_annotations = [
  { "category" = "signal", "effect" = "approximated", "reason" = "asymmetry irrecoverable", "refs" = ["openxr.fb2.XR_FACE_EXPRESSION2_INNER_BROW_RAISER_L_FB", "openxr.fb2.XR_FACE_EXPRESSION2_INNER_BROW_RAISER_R_FB", "arkit.coefficient.browInnerUp"], "units" = "1" },
  { "category" = "signal", "effect" = "approximated", "reason" = "provider gain and full-activation pose are not published; 0 and 1 endpoints assumed equal", "refs" = ["openxr.fb2.XR_FACE_EXPRESSION2_INNER_BROW_RAISER_L_FB", "openxr.fb2.XR_FACE_EXPRESSION2_INNER_BROW_RAISER_R_FB", "arkit.coefficient.browInnerUp"], "units" = "1" },
]

