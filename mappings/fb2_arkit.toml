inputs = ["openxr.fb2.XR_FACE_EXPRESSION2_EYES_LOOK_UP_L_FB"]
outputs = ["arkit.coefficient.eyeLookUpLeft"]
operator = { "id" = "affine", "scale" = 1.0, "offset" = 0.0 }
disposition = "mapped"
mapping_quality = "approximate"
evidence_status = "proposed"
assumptions = [
  "FB2 EYES_LOOK_UP_L corresponds to ARKit eyeLookUpLeft.",
  "FB2 weight 0 (not active) and 1 (fully active) are taken to equal ARKit neutral (0) and maximum (1), linear in between; neither provider publishes its gain curve or full-activation pose.",
  "Both providers name sides from the subject's own face (FB2 describes 'the left eye'; ARKit coefficients are face-relative).",
]
evidence = ["xr_fb2", "apple_blendshapes", "godot_vendors_fb2", "godot_face_modifier", "vrcft_docs_arkit", "vrcft_docs_movement", "ict_facekit"]
loss_annotations = [
  { "category" = "signal", "effect" = "approximated", "reason" = "provider gain and full-activation pose are not published; 0 and 1 endpoints assumed equal", "refs" = ["openxr.fb2.XR_FACE_EXPRESSION2_EYES_LOOK_UP_L_FB", "arkit.coefficient.eyeLookUpLeft"], "units" = "1" },
  { "category" = "signal", "effect" = "approximated", "reason" = "FB2 maximum gaze angle is unspecified", "refs" = ["openxr.fb2.XR_FACE_EXPRESSION2_EYES_LOOK_UP_L_FB", "arkit.coefficient.eyeLookUpLeft"], "units" = "1" },
  { "category" = "signal", "effect" = "approximated", "reason" = "FB2 describes eye rotation; ARKit describes eyelid movement consistent with the gaze", "refs" = ["openxr.fb2.XR_FACE_EXPRESSION2_EYES_LOOK_UP_L_FB", "arkit.coefficient.eyeLookUpLeft"], "units" = "1" },
  { "category" = "signal", "effect" = "approximated", "reason" = "FB2 opposing directions are mutually exclusive; ARKit states no such constraint", "refs" = ["openxr.fb2.XR_FACE_EXPRESSION2_EYES_LOOK_UP_L_FB", "arkit.coefficient.eyeLookUpLeft"], "units" = "1" },
]

