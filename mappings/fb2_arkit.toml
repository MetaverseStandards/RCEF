# SPDX-License-Identifier: CC-BY-SA-4.0
# Original RCEF data; attributed source identifiers are factual inventories.
# Proposed FB2 -> ARKit translations, all 52 coefficients. Gaze rules are a separate mapping because FB2
# can report the face valid while eye following is not, and msf-tools refuses a
# frame in which any input of a mapping is invalid.

[[mappings]]
id = "fb2.to_arkit"

[[mappings.rules]]
id = "fb2_arkit.eyeBlinkLeft"
inputs = ["openxr.fb2.XR_FACE_EXPRESSION2_EYES_CLOSED_L_FB"]
outputs = ["arkit.coefficient.eyeBlinkLeft"]
operator = { "id" = "affine", "scale" = 1.0, "offset" = 0.0 }
disposition = "mapped"
mapping_quality = "approximate"
evidence_status = "proposed"
assumptions = [
  "FB2 EYES_CLOSED_L corresponds to ARKit eyeBlinkLeft.",
  "FB2 weight 0 (not active) and 1 (fully active) are taken to equal ARKit neutral (0) and maximum (1), linear in between; neither provider publishes its gain curve or full-activation pose.",
  "Both providers name sides from the subject's own face (FB2 describes 'the left eye'; ARKit coefficients are face-relative).",
]
evidence = ["xr_fb2", "apple_blendshapes", "vrcft_docs_movement", "vrcft_docs_arkit", "godot_vendors_fb2", "godot_face_modifier", "ict_facekit"]
loss_annotations = [
  { "category" = "signal", "effect" = "approximated", "reason" = "provider gain and full-activation pose are not published; 0 and 1 endpoints assumed equal", "refs" = ["openxr.fb2.XR_FACE_EXPRESSION2_EYES_CLOSED_L_FB", "arkit.coefficient.eyeBlinkLeft"], "units" = "1" },
]

