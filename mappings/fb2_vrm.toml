# Original RCEF data; attributed source identifiers are factual inventories.
# Proposed FB2 eye closure -> VRM 1.0 per-eye blink presets.

[[mappings]]
id = "fb2.to_vrm"

[[mappings.rules]]
id = "fb2_vrm.blinkLeft"
inputs = ["openxr.fb2.XR_FACE_EXPRESSION2_EYES_CLOSED_L_FB"]
outputs = ["vrm.preset.blinkLeft"]
operator = { "id" = "affine", "scale" = 1.0, "offset" = 0.0 }
disposition = "mapped"
mapping_quality = "approximate"
evidence_status = "proposed"
assumptions = [
  "FB2 EYES_CLOSED_L (lowers the top eyelid of the left eye) corresponds to VRM preset blinkLeft (closes the left eyelid); the definitions agree, but no published table pairs them.",
  "FB2 weight (0 to 1) is used directly as the VRM expression weight (0 to 1).",
  "Both name sides from the subject's own face. FLAGGED: VRM gives no normative side; on the VRM 1.0 Twist sample blinkLeft moves the avatar's own left eyelid.",
  "VRM isBinary and override effects happen downstream in the VRM runtime and are not modelled.",
]
evidence = ["xr_fb2", "vrm_expressions"]
loss_annotations = [
  { "category" = "signal", "effect" = "approximated", "reason" = "an FB2 weight becomes an asset-authored expression weight", "refs" = ["openxr.fb2.XR_FACE_EXPRESSION2_EYES_CLOSED_L_FB", "vrm.preset.blinkLeft"], "units" = "1" },
  { "category" = "signal", "effect" = "approximated", "reason" = "VRM blink (both eyes) is left unset, so a model that binds only blink, not blinkLeft and blinkRight, does not blink", "refs" = ["openxr.fb2.XR_FACE_EXPRESSION2_EYES_CLOSED_L_FB", "vrm.preset.blinkLeft"], "units" = "1" },
]

