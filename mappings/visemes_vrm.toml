# Original RCEF data; attributed source identifiers are factual inventories.
# Proposed META viseme -> VRM 1.0 lip-sync preset translations.

[[mappings]]
id = "visemes.to_vrm"

[[mappings.rules]]
id = "visemes_vrm.aa"
inputs = ["openxr.visemes.XR_FACE_TRACKING_VISEME_AA_META"]
outputs = ["vrm.preset.aa"]
operator = { "id" = "affine", "scale" = 1.0, "offset" = 0.0 }
disposition = "mapped"
mapping_quality = "approximate"
evidence_status = "proposed"
assumptions = [
  "META viseme AA corresponds to VRM preset aa (META \"A:\" as in car; VRM remark \"aa\").",
  "Phoneme-label correspondence only; no published table maps META visemes to VRM presets.",
  "META viseme probability (0 to 1) is used directly as the VRM expression weight (0 to 1).",
  "VRM isBinary and override effects happen downstream in the VRM runtime and are not modelled.",
]
evidence = ["xr_visemes", "vrm_expressions"]
loss_annotations = [
  { "category" = "signal", "effect" = "approximated", "reason" = "consonant visemes are dropped, so outputs no longer sum to 1", "refs" = ["openxr.visemes.XR_FACE_TRACKING_VISEME_AA_META", "vrm.preset.aa"], "units" = "1" },
  { "category" = "signal", "effect" = "approximated", "reason" = "a viseme probability becomes an asset-authored expression weight", "refs" = ["openxr.visemes.XR_FACE_TRACKING_VISEME_AA_META", "vrm.preset.aa"], "units" = "1" },
]

